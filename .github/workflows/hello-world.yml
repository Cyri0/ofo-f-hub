name: "Hello World"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello World"

      - name: Kernel
        run: uname -a

      - name: Git
        run: git --version

      - name: Tehen
        run: |
          sudo apt-get update
          sudo apt-get install -y cowsay
          cowsay "Dalogh Bávid TöRiéRecCségI"